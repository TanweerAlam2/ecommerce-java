<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout — Marketly</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar">
  <a class="brand" href="/">marketly<span>.</span></a>
  <form class="search" action="/" method="get"><input name="q" placeholder="Search products, brands and more"><button>Search</button></form>
  <nav><a href="/account">Account</a><a href="/orders">Orders</a><a href="/cart" class="cart">Cart <b id="cartCount">0</b></a></nav>
</header><main class="page narrow"><p class="eyebrow">SECURE CHECKOUT</p><h1>Complete your order</h1><form class="checkout-form" id="checkoutForm"><section class="panel"><h2>Contact information</h2><label>Email address<input type="email" required placeholder="you@example.com"></label><h2>Delivery address</h2><div class="form-grid"><label>First name<input required></label><label>Last name<input required></label></div><label>Address<input required></label><div class="form-grid"><label>City<input required></label><label>Postal code<input required></label></div></section><aside class="panel summary"><h2>Payment</h2><label>Card number<input inputmode="numeric" required placeholder="4242 4242 4242 4242"></label><div class="form-grid"><label>Expiry<input required placeholder="MM/YY"></label><label>CVV<input required placeholder="123"></label></div><button class="primary full" type="submit">Place order</button><p class="muted small">Demo checkout — no payment is processed.</p></aside></form><div id="checkoutMessage" class="success" hidden>Order placed successfully. Thank you for shopping with Marketly.</div></main><footer><div class="brand">marketly<span>.</span></div><p>Thoughtful products, delivered simply.</p><div class="footer-links"><a href="/about">About</a><a href="/contact">Contact</a><a href="/orders">Track orders</a></div></footer><script src="/js/app.js"></script></body></html>
