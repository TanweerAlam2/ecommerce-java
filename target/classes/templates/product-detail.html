<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title th:text="${product.name} + ' — Marketly'"></title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="/">marketly<span>.</span></a><a href="/" class="back">← Continue shopping</a><nav><a href="/account">Account</a><a href="/cart">Cart <b id="cartCount">0</b></a></nav></header>
<main class="detail"><img th:src="${product.imageUrl}" th:alt="${product.name}"><div><p class="eyebrow" th:text="${product.category}"></p><h1 th:text="${product.name}"></h1><div class="rating">★ <span th:text="${product.rating}"></span></div><p class="detail-price" th:text="'$' + ${product.price}"></p><p th:text="${product.description}"></p><button class="primary add" th:attr="data-id=${product.id}">Add to cart</button></div></main>
<script src="/js/app.js"></script></body></html>
